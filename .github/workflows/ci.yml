name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  check:
    name: 语法与触发词评测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 脚本语法检查
        run: |
          python -m compileall -q scripts/

      - name: 触发词评测(门禁)
        run: python scripts/eval_triggers.py

      - name: 产出评测报告
        if: always()
        run: |
          python scripts/eval_triggers.py --json > trigger-eval.json || true
          cat trigger-eval.json

      - name: 上传评测产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-eval
          path: trigger-eval.json
          if-no-files-found: ignore

  selfcheck:
    name: 数据源与文档自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 数据源自检(免安装依赖,仅静态声明)
        run: python scripts/scrape_jobs.py --check-sources

      - name: README 内部链接校验
        run: |
          python - <<'PY'
          import os, re, sys
          md = open('README.md', encoding='utf-8').read()
          bad = []
          for link in re.findall(r'\]\(([^)#]+)\)', md):
              if link.startswith(('http', 'mailto')):
                  continue
              if not os.path.exists(link):
                  bad.append(link)
          if bad:
              print('失效链接:', bad); sys.exit(1)
          print('README 内部链接全部有效')
          PY

      - name: 确认未提交登录态与产物
        run: |
          if [ -d profile ] || [ -d out ] || [ -d raw ]; then
            echo "检测到不应入库的目录(profile/out/raw),拒绝通过"; exit 1
          fi
          # 三个关键词都用 [x]xx 形式断开,否则 pattern 本身会被本文件匹配到
          if grep -rIlE "[a]ccessToken|[r]efreshToken|[c]lientToken" --exclude-dir=.git . ; then
            echo "检测到疑似令牌内容,拒绝通过"; exit 1
          fi
          echo "无登录态与敏感内容"
