name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ---- 门禁:语法 + 触发词评测 ----
  gate:
    name: 门禁（语法 + 触发词评测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 脚本语法检查
        run: python -m compileall -q scripts/
      - name: 触发词评测
        run: python scripts/eval_triggers.py

  # ---- 数据源自检(runner 无 playwright,同时验证惰性导入) ----
  sources:
    name: 数据源自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 数据源自检
        run: python scripts/scrape_jobs.py --check-sources

  # ---- 文档链接校验 ----
  docs:
    name: 文档链接校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: README 内部链接校验
        run: python scripts/check_docs.py

  # ---- 安全守卫 ----
  safety:
    name: 安全守卫（登录态 / 敏感内容）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 确认未提交登录态与产物
        run: python scripts/check_safety.py
